<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="leafGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  
  <!-- Outer Subtle Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.4" />

  <!-- Lotus / Zen Flower Petals -->
  <!-- Left Side Petals -->
  <path d="M256 368 C160 348 138 240 196 182 C224 250 246 320 256 368 Z" fill="url(#leafGrad512)" opacity="0.85" />
  <!-- Right Side Petals -->
  <path d="M256 368 C352 348 374 240 316 182 C288 250 266 320 256 368 Z" fill="url(#leafGrad512)" opacity="0.85" />
  <!-- Center Main Petal with subtle glow -->
  <path d="M256 378 C192 292 192 172 256 112 C320 172 320 292 256 378 Z" fill="url(#glowGrad512)" filter="url(#softGlow)" />
  
  <!-- Calming Aura Core Drop -->
  <circle cx="256" cy="196" r="16" fill="#ecfdf5" />
  
  <!-- Base Ripple Arc -->
  <path d="M180 384 Q256 416 332 384" fill="none" stroke="#6ee7b7" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M208 406 Q256 426 304 406" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.6" />
</svg>
